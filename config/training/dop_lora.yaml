# @package _global_

defaults:
  - /base
  - _self_

character: jerry

# DOP preserves the base model's output for the class-replaced version of each
# caption while learning the character from the original caption.
recipe:
  method: dop
  trigger_word: "Jerry Seinfeld"
  preservation_class: "a man"
  preservation_loss_weight: 1.0

adapter:
  method: lora
  r: 32
  alpha: 32
  target_modules: ".*\\.(to_k|to_q|to_v|to_out\\.0)"
  dropout: 0.0
  bias: none

train:
  epochs: 200
  lr: 1.0e-4
  weight_decay: 1.0e-4
  batch_size: 1
  seed: 42
  max_grad_norm: 1.0

sample_prompts:
  - "a portrait of ${recipe.trigger_word}, high quality"
  - "a photo of ${recipe.trigger_word} sitting at a diner"
  - "a photo of ${recipe.trigger_word} in front of the Eiffel Tower"
  - "a portrait of ${recipe.preservation_class}, high quality"

output_dir: ./outputs/${character}_${recipe.method}_${adapter.method}_r${adapter.r}
