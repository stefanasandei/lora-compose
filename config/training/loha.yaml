# @package _global_

defaults:
  - /base
  - _self_

character: jerry

recipe:
  method: standard

adapter:
  method: loha
  # LoHa has two low-rank branches; rank 32 gives it substantially more
  # update capacity than LoRA while remaining practical on a 24 GB GPU.
  r: 32
  alpha: 32
  target_modules: ".*\\.(to_k|to_q|to_v|to_out\\.0)"
  rank_dropout: 0.0
  module_dropout: 0.0
  # PEFT's default zero-delta initialization preserves the frozen model at
  # step zero. Do not use a random, non-zero adapter initialization here.
  init_weights: true

train:
  epochs: 200
  lr: 1.0e-4
  weight_decay: 1.0e-4
  batch_size: 1
  seed: 42
  max_grad_norm: 1.0
  gradient_checkpointing: true

sample_prompts:
  - "a photo of Jerry Seinfeld performing stand-up comedy on a dark stage"
  - "a portrait of Jerry Seinfeld, high quality"
  - "a photo of Jerry Seinfeld sitting on a couch"
  - "a photo of a man sitting on a couch"
  - "a photo of Jerry Seinfeld in front of the Eiffel Tower"

output_dir: ./outputs/${character}_${adapter.method}_r${adapter.r}
